[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiforge"
dynamic = ["version"]
description = "A modular, provider-agnostic AI coding framework with a pluggable skill system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AIForge Contributors" }]
keywords = ["ai", "llm", "claude", "anthropic", "agent", "framework", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
fast = ["orjson>=3.10.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "bandit[toml]>=1.7.10",
  "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/haidar-boop/claude-ai-brain"
Documentation = "https://github.com/haidar-boop/claude-ai-brain/tree/main/docs"
Issues = "https://github.com/haidar-boop/claude-ai-brain/issues"

[project.scripts]
aiforge = "aiforge.api.cli:main"

[project.entry-points."aiforge.providers"]
anthropic = "aiforge.providers.anthropic_provider:AnthropicProvider"
fake = "aiforge.providers.fake:FakeProvider"

[tool.hatch.version]
path = "src/aiforge/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiforge"]

[tool.hatch.build]
include = [
  "src/aiforge/**/*.py",
  "src/aiforge/**/*.toml",
  "src/aiforge/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S310"]
"benchmarks/**" = ["S101", "S603"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["aiforge"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orjson"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "live: requires a real ANTHROPIC_API_KEY and network access; skipped by default",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/aiforge"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
