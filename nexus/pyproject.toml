[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-workspace"
dynamic = ["version"]
description = "Nexus: a personal productivity and AI workspace for the desktop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Nexus Contributors" }]
keywords = ["productivity", "notes", "tasks", "ai", "desktop", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Groupware",
  "Typing :: Typed",
]
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "cryptography>=43.0",
  "PyYAML>=6.0",
  "watchdog>=5.0",
  "aiohttp>=3.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
# The AI assistant uses AIForge (the provider-abstraction framework that
# lives at this repository's root) for multi-provider LLM access. It is not
# on PyPI, so install it from the repo first:  pip install -e <repo-root>
# The nexus.ai package degrades with a clear error message if it's absent.
ocr = ["pytesseract>=0.3.13", "Pillow>=10.4"]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.version]
path = "src/nexus/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build]
include = [
  "src/nexus/**/*.py",
  "src/nexus/**/*.qss",
  "src/nexus/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]
# __main__ is a 3-line runtime shim that imports the CLI; excluded so type
# checking a partially-built tree doesn't flag a not-yet-created module.
exclude = "src/nexus/__main__.py"

[[tool.mypy.overrides]]
module = ["aiforge.*", "watchdog.*", "pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
asyncio_mode = "auto"
markers = [
  "gui: exercises PySide6 widgets (runs offscreen in CI)",
]

[tool.coverage.run]
source = ["src/nexus"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
